<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – EMpaticos</title>

  <!-- Fuente Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>

<body style="background-color: #f1f5f9;">
  <!-- Navbar Consistente (Variante Admin) -->
  <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #333 !important;">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <span class="fw-bold fs-3 text-white">EMpaticos - <span class="text-warning">Panel Admin</span></span>
      </a>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link text-white fw-bold" href="index.html">Volver al sitio</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container" style="padding-top: 100px;">
    <div class="text-center mb-5">
      <h1 class="fw-bold display-5 text-dark mb-2">Historias Pendientes</h1>
      <p class="text-muted">Aproba las historias en Firebase NoSQL para que se muestren en la página.</p>
    </div>

    <!-- Login -->
    <div class="row justify-content-center" id="login-section">
      <div class="col-md-5">
        <div class="card p-4 rounded-4 shadow-sm border-0">
          <div class="card-body text-center">
            <h5 class="fw-bold mb-4">Acceso Reservado</h5>
            <div class="mb-4">
              <input type="password" class="form-control form-control-lg text-center" id="admin-password" placeholder="Contraseña maestra">
            </div>
            <button id="btn-login" class="btn btn-warning btn-lg w-100 fw-bold">Entrar de forma segura</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel admin (oculto al inicio) -->
    <div id="admin-panel" style="display:none;" class="mt-4">
      <div class="d-flex justify-content-between mb-5 align-items-center bg-light p-3 rounded-4 shadow-sm">
        <h3 class="m-0 fw-bold text-dark">Pendientes de revisión</h3>
        <div>
          <button id="btn-reload" class="btn btn-outline-warning fw-bold bg-white me-2">↻ Recargar</button>
          <button id="btn-logout" class="btn btn-outline-secondary fw-bold bg-white">Cerrar sesión</button>
        </div>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="stories-list">
        <!-- Cards cargadas por Firebase JS -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="./js/admin.js"></script>
</body>
</html>
