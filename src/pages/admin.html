<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin – EMpaticos</title>

  <!-- Fuente Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./script.js" defer></script>
</head>

<body>
  <!-- Navbar Consistente -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="./images/LogoEMpaticos2.png" alt="EMpaticos" height="50" class="me-3">
        <span class="fw-bold fs-3 text-muted">EMpaticos <span class="fs-6 fw-normal text-muted ms-2">Admin</span></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link fw-bold" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link fw-bold" href="noticias.html">Noticias</a></li>
          <li class="nav-item"><a class="nav-link fw-bold" href="unirme.html">Unirme</a></li>
          <li class="nav-item"><a class="nav-link fw-bold" href="historias.html">Historias</a></li>
          <li class="nav-item"><a class="nav-link fw-bold" href="nosotros.html">Nosotros</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="text-center mb-5">
      <h1 class="fw-bold display-5 text-warning mb-3">Panel de Administración</h1>
      <p class="lead text-muted">Gestión segura de historias y contenido de la comunidad.</p>
    </div>

    <!-- Login -->
    <div class="row justify-content-center" id="login-section">
      <div class="col-md-5">
        <div class="card p-4 rounded-4 shadow-sm border-0">
          <div class="card-body text-center">
            <h5 class="fw-bold mb-4">Acceso Reservado</h5>
            <div class="mb-4">
              <input type="password" class="form-control form-control-lg text-center" id="admin-password" placeholder="Contraseña maestra">
            </div>
            <button onclick="login()" class="btn btn-warning btn-lg w-100 fw-bold">Entrar de forma segura</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Panel admin (oculto al inicio) -->
    <div id="admin-panel" style="display:none;" class="mt-4">
      <div class="d-flex justify-content-between mb-5 align-items-center bg-light p-3 rounded-4 shadow-sm">
        <h3 class="m-0 fw-bold text-dark">Pendientes de revisión</h3>
        <div>
          <button onclick="loadStories()" class="btn btn-outline-warning fw-bold bg-white me-2">↻ Recargar</button>
          <button onclick="logout()" class="btn btn-outline-secondary fw-bold bg-white">Cerrar sesión</button>
        </div>
      </div>

      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="stories-list">
        <!-- Cards cargadas por JS -->
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p class="fs-5">EMpaticos © 2026 – No estás solo ❤️</p>
      <p>Contactanos: matii.toorres.06@gmail.com</p>
    </div>
  </footer>

  <script>
    const API_URL = "https://lazaro-backend-sqlite.onrender.com/api";

    const ADMIN_PASSWORD = "EMpaticos2025arg";

    function login() {
      const pass = document.getElementById('admin-password').value;
      if (pass === ADMIN_PASSWORD) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadStories();
      } else {
        alert("🔒 Contraseña incorrecta ❤️");
      }
    }

    function logout() {
      document.getElementById('login-section').style.display = 'flex';
      document.getElementById('admin-panel').style.display = 'none';
      document.getElementById('admin-password').value = '';
    }

    async function loadStories() {
      const list = document.getElementById('stories-list');
      list.innerHTML = '<div class="col-12 text-center my-5"><p class="lead fw-bold text-muted w-100">Buscando historias en la base de datos...</p></div>';

      try {
        const res = await fetch(`${API_URL}/stories/all`);
        if (!res.ok) {
          const errText = await res.text();
          throw new Error(`Backend respondió con error ${res.status}: ${errText}`);
        }
        const stories = await res.json();

        list.innerHTML = '';

        if (stories.length === 0) {
          list.innerHTML = '<div class="col-12 text-center my-5"><p class="lead fw-bold text-muted w-100">✨ ¡Todo al día! No hay historias pendientes.</p></div>';
          return;
        }

        stories.forEach(story => {
          const col = document.createElement('div');
          col.className = 'col';
          col.innerHTML = `
            <div class="card h-100 border-0 shadow-sm rounded-4">
              <div class="card-body d-flex flex-column p-4">
                <h5 class="card-title text-warning fw-bold mb-3">${story.nombre || 'Anónimo'} <span class="badge bg-light text-dark ms-2 border">${story.tipoEM || 'N/A'}</span></h5>
                <p class="card-text flex-grow-1 text-muted">${story.historia}</p>
                <small class="text-secondary fw-bold mb-4">${new Date(story.createdAt).toLocaleDateString()}</small>
                <div class="mt-auto d-flex gap-2">
                  ${story.approved ? '<span class="badge bg-success w-100 py-2 fs-6">✅ Aprobada</span>' : `
                    <button onclick="approveStory(${story.id})" class="btn btn-aprobar flex-fill py-2 fw-bold">✓ Aprobar</button>
                    <button onclick="rejectStory(${story.id})" class="btn btn-rechazar flex-fill py-2 fw-bold">✕ Rechazar</button>
                  `}
                </div>
              </div>
            </div>
          `;
          list.appendChild(col);
        });
      } catch (err) {
        console.error('Error completo en loadStories:', err);
        list.innerHTML = `
        <div class="col-12 text-center my-5">
          <div class="alert alert-danger rounded-4 d-inline-block p-4">
            <h5 class="fw-bold">⚠️ Error al conectar</h5>
            <p class="mb-0">${err.message}</p>
          </div>
        </div>`;
      }
    }

    async function approveStory(id) {
      try {
        const res = await fetch(`${API_URL}/stories/${id}/approve`, { method: 'PATCH' });
        if (!res.ok) throw new Error(await res.text());
        loadStories();
      } catch (err) {
        alert("Error aprobando: " + err.message);
        loadStories();
      }
    }

    async function rejectStory(id) {
      if (confirm("⚠️ ¿Seguro que querés rechazar y BORRAR esta historia permanentemente?")) {
        try {
          const res = await fetch(`${API_URL}/stories/${id}`, { method: 'DELETE' });
          if (!res.ok) throw new Error(await res.text());
          loadStories();
        } catch (err) {
          alert("Error borrando: " + err.message);
          loadStories();
        }
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
